# Configuration SonarQube pour geoservice-map-vue3
sonar.projectKey=geoservice-map-vue3
sonar.projectName=GeoService Map Vue3
sonar.projectVersion=1.1.7

# Configuration serveur SonarQube
sonar.host.url=http://192.168.1.20:9000

# Token d'authentification - � configurer via variable d'environnement
# M�thode recommand�e : utiliser SONAR_TOKEN en variable d'environnement
# Exemple : export SONAR_TOKEN=your_token_here
# Alternative : d�commenter la ligne suivante et remplacer par votre token
# sonar.token=your_token_here

# R�pertoires source
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.js,**/*.test.js,**/*.spec.ts,**/*.test.ts

# Exclusions
# Tests exclus de l'analyse (sonar.tests seul ne les exclut pas)
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.min.js,**/vendor/**,**/__tests__/**,**/*.test.js,**/*.spec.js,**/*.test.ts,**/*.spec.ts
sonar.test.exclusions=**/node_modules/**,**/dist/**

# Param�tres g�n�raux
sonar.sourceEncoding=UTF-8

# Configuration des langages
# Les fichiers .vue sont trait�s comme des fichiers JavaScript
sonar.javascript.file.suffixes=.js,.jsx,.vue
sonar.typescript.file.suffixes=.ts,.tsx

# Configuration sp�cifique pour Vue.js
# Permet l'analyse du code TypeScript dans les fichiers .vue
sonar.javascript.environments=vue

# Coverage et résultats de tests
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.junit.reportPaths=coverage/test-report.xml