version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "docker"
    directory: "/geoservice-isochrone-v2/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "maven"
    directory: "/dbf2csv/"
    schedule:
      interval: "weekly"
      day: "friday"
    labels:
      - "dependencies"
      - "security"
    # Minor/patch du sous-projet en une seule PR ; majors + sécurité en PR individuelles
    groups:
      minorAndPatch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"


  # ☕ Configuration pour Java (Maven)
  - package-ecosystem: "maven"
    directory: "/geoservice-isochrone-v2/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    # Minor/patch du sous-projet en une seule PR ; majors + sécurité en PR individuelles
    groups:
      minorAndPatch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Les alertes de sécurité (Critical/High) ignorent ce planning hebdomadaire
    # et créeront une PR immédiatement dès la découverte de la faille.

  - package-ecosystem: "npm"
    directory: "/geoservice-map-vue3/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"

    # Stratégie de regroupement pour réduire le "bruit" visuel sur NPM
    groups:
      # Regroupe toutes les dépendances de dev (tests, linters) en une seule PR hebdo
      devDependencies:
        dependency-type: "development"
      # Regroupe les sous-dépendances de production non-critiques
      minorAndPatchUpdates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    # Les failles de sécurité critiques/hautes NPM passeront TOUJOURS en priorité
    # et en dehors de ces groupes sous forme de PR individuelles immédiates.
