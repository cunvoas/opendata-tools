<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{fragments/fragment-head :: head(#{compute.request.title})}"></head>

<body class="sb-nav-fixed">
    <div th:replace="~{fragments/fragment-navUp :: navUp}"></div>
    <div id="layoutSidenav">
        <div th:replace="~{fragments/fragment-navLeft :: navLeft}"></div>

        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4" th:text="#{compute.request.title}">Lancement de calcul</h1>

                    <ol class="breadcrumb mb-4">
                        <li class="breadcrumb-item"><a th:href="@{/mvc/dashboard}" th:text="#{menu.abstract.dashboard}">Dashboard</a></li>
                        <li class="breadcrumb-item active" th:text="#{compute.request.title}">Lancement</li>
                    </ol>

                    <!-- Bandeau de filtres : Région / EPCI / Ville / Année -->
                    <div class="card mb-3 border-0 shadow-sm">
                        <div class="card-body">
                            <div class="row g-3">

                                <!-- Région -->
                                <div class="col-md-3">
                                    <form th:action="@{/mvc/management/compute/region}" method="post"
                                          onchange="this.submit();" class="w-100">
                                        <div class="form-floating">
                                            <select class="form-select" id="idRegion" name="idRegion">
                                                <option value="" th:text="#{compute.request.choose.region}">Région...</option>
                                                <option th:each="r : ${regions}"
                                                        th:value="${r.id}"
                                                        th:text="${r.name}"
                                                        th:selected="${form != null and r.id == form.idRegion}"></option>
                                            </select>
                                            <label for="idRegion"><i class="fas fa-map me-2"></i>
                                                <span th:text="#{compute.request.region}">Région</span>
                                            </label>
                                        </div>
                                    </form>
                                </div>

                                <!-- EPCI -->
                                <div class="col-md-3">
                                    <form th:action="@{/mvc/management/compute/epci}" method="post"
                                          onchange="this.submit();" class="w-100">
                                        <fieldset th:disabled="${form == null or form.idRegion == null}">
                                            <div class="form-floating">
                                                <select class="form-select" id="idCommunauteDeCommunes" name="idCommunauteDeCommunes">
                                                    <option value="" th:text="#{compute.request.choose.epci}">EPCI...</option>
                                                    <option th:each="c : ${epcis}"
                                                            th:value="${c.id}"
                                                            th:text="${c.name}"
                                                            th:selected="${form != null and c.id == form.idCommunauteDeCommunes}"></option>
                                                </select>
                                                <label for="idCommunauteDeCommunes"><i class="fas fa-building me-2"></i>
                                                    <span th:text="#{compute.request.epci}">EPCI</span>
                                                </label>
                                            </div>
                                        </fieldset>
                                        <input type="hidden" name="idRegion" th:value="${form != null ? form.idRegion : ''}" />
                                    </form>
                                </div>

                                <!-- Ville -->
                                <div class="col-md-3">
                                    <form th:action="@{/mvc/management/compute/city}" method="post" class="w-100">
                                        <fieldset th:disabled="${form == null or form.idCommunauteDeCommunes == null}">
                                            <div class="form-floating">
                                                <select class="form-select" id="idCity" name="idCommune" onchange="this.submit()">
                                                    <option value="" th:text="#{compute.request.choose.city}">Ville...</option>
                                                    <option th:each="v : ${cities}"
                                                            th:value="${v.id}"
                                                            th:text="${v.displayName}"
                                                            th:selected="${form != null and v.id == form.idCommune}"></option>
                                                </select>
                                                <label for="idCity"><i class="fas fa-city me-2"></i>
                                                    <span th:text="#{compute.request.city}">Ville</span>
                                                </label>
                                            </div>
                                        </fieldset>
                                        <input type="hidden" name="idRegion" th:value="${form != null ? form.idRegion : ''}" />
                                        <input type="hidden" name="idCommunauteDeCommunes" th:value="${form != null ? form.idCommunauteDeCommunes : ''}" />
                                    </form>
                                </div>

                                <!-- Année -->
                                <div class="col-md-3">
                                    <div class="form-floating">
                                        <select class="form-select" id="requestedYear" name="requestedYear">
                                            <option value="" th:text="#{compute.request.allyears}">Toutes les années</option>
                                            <option th:each="year : ${years}"
                                                    th:value="${year}"
                                                    th:text="${year}"
                                                    th:selected="${year == defaultYear}"></option>
                                        </select>
                                        <label for="requestedYear"><i class="fas fa-calendar me-2"></i>
                                            <span th:text="#{compute.request.year}">Année</span>
                                        </label>
                                    </div>
                                </div>

                            </div><!-- /row -->
                        </div><!-- /card-body -->
                    </div><!-- /card filtres -->

                    <!-- Bloc Parc -->
                    <sec:authorize access="hasRole('ADMINISTRATOR')">
                    <div class="card mb-4">
                        <div class="card-header">
                            <i class="fas fa-tree me-1"></i>
                            <span th:text="#{compute.request.block.parc}">Parc</span>
                        </div>
                        <div class="card-body">
                            <div class="d-flex flex-wrap gap-2 mb-2">
                                <button id="btnComputeEpci" onclick="requestComputeEpci()" type="button" class="btn btn-outline-secondary">
                                    <i class="fas fa-building me-1"></i><span th:text="#{compute.request.btn.epci}">Calculer l'accessibilité aux parcs et carreaux de l'EPCI</span>
                                </button>
                                <button id="btnComputeCity" onclick="requestComputeCity()" type="button" class="btn btn-outline-secondary">
                                    <i class="fas fa-city me-1"></i><span th:text="#{compute.request.btn.city}">Calculer l'accessibilité aux parcs et carreaux de la ville</span>
                                </button>
                            </div>
                            <div class="d-flex flex-wrap gap-2 mb-2">
                                <button id="btnNdviEpci" onclick="requestNdviEpci()" type="button" class="btn btn-outline-danger">
                                    <i class="fas fa-satellite me-1"></i><span th:text="#{compute.request.ndvi.epci}">Calculer avec Copernicus la végétation des parcs de l'EPCI</span>
                                </button>
                                <button id="btnNdviCity" onclick="requestNdviCity()" type="button" class="btn btn-outline-danger">
                                    <i class="fas fa-satellite me-1"></i><span th:text="#{compute.request.ndvi.city}">Calculer avec Copernicus la végétation des parcs de la ville</span>
                                </button>
                            </div>
                            <div class="d-flex flex-wrap gap-2 align-items-center">
                                <button id="btnPublishEpci" onclick="publishEpci()" type="button" class="btn btn-outline-primary">
                                    <i class="fas fa-upload me-1"></i><span th:text="#{compute.request.publish.epci}">Publier les données de l'EPCI</span>
                                </button>
                                <button id="btnPublishCity" onclick="publishCity()" type="button" class="btn btn-outline-primary" disabled
                                        title="Publication par ville : à venir">
                                    <i class="fas fa-upload me-1"></i><span th:text="#{compute.request.publish.city}">Publier les données de la ville</span>
                                </button>
                                <div id="computeSpinner" class="spinner-border text-success" role="status" style="display:none;">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Bloc Overpass -->
                    <div class="card mb-4">
                        <div class="card-header">
                            <i class="fas fa-layer-group me-1"></i>
                            <span th:text="#{compute.request.block.overpass}">Overpass</span>
                        </div>
                        <div class="card-body">
                            <button id="btnComputeParkOverpass" onclick="launchParkOverpass()" type="button" class="btn btn-success">
                                <i class="fas fa-layer-group me-1"></i><span th:text="#{compute.request.launch.park_overpass}">Park Overpass</span>
                            </button>
                        </div>
                    </div>

                    <!-- Bloc IRIS -->
                    <div class="card mb-4">
                        <div class="card-header">
                            <i class="fas fa-draw-polygon me-1"></i>
                            <span th:text="#{compute.request.block.iris}">IRIS</span>
                        </div>
                        <div class="card-body">
                            <div class="d-flex flex-wrap gap-2 mb-2">
                                <button id="btnComputeIrisEpci" type="button" class="btn btn-outline-secondary" disabled
                                        th:title="#{compute.request.iris.soon}">
                                    <i class="fas fa-building me-1"></i><span th:text="#{compute.request.iris.compute.epci}">Calculer l'accessibilité aux parcs et carreaux des IRIS de l'EPCI</span>
                                </button>
                                <button id="btnComputeIrisCity" type="button" class="btn btn-outline-secondary" disabled
                                        th:title="#{compute.request.iris.soon}">
                                    <i class="fas fa-city me-1"></i><span th:text="#{compute.request.iris.compute.city}">Calculer l'accessibilité aux parcs et carreaux des IRIS de la ville</span>
                                </button>
                            </div>
                            <div class="d-flex flex-wrap gap-2">
                                <button id="btnNdviIrisEpci" onclick="requestNdviIrisEpci()" type="button" class="btn btn-outline-warning">
                                    <i class="fas fa-satellite me-1"></i><span th:text="#{compute.request.ndvi.iris.epci}">Lancer Copernicus sur les IRIS de l'EPCI</span>
                                </button>
                                <button id="btnNdviIrisCity" onclick="requestNdviIrisCity()" type="button" class="btn btn-outline-warning">
                                    <i class="fas fa-satellite me-1"></i><span th:text="#{compute.request.ndvi.iris.city}">Lancer Copernicus sur les IRIS de la ville</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Bloc référentiel -->
                    <div class="card mb-4">
                        <div class="card-header">
                            <i class="fas fa-database me-1"></i>
                            <span th:text="#{compute.request.block.referential}">Référentiel</span>
                        </div>
                        <div class="card-body">
                            <button id="btnPublishReferential" onclick="publishReferential()" type="button" class="btn btn-outline-primary">
                                <i class="fas fa-upload me-1"></i><span th:text="#{compute.request.publish.referential}">Publier le référentiel</span>
                            </button>
                        </div>
                    </div>
                    </sec:authorize>

                </div>
            </main>
            <div th:replace="~{fragments/fragment-footer :: footer}"></div>
        </div>
    </div>
    <div th:replace="~{fragments/fragment-jslibs :: appPage}"></div>

    <script th:src="@{/mvc/static/js/scripts.js}"></script>

    <script th:inline="javascript">
    /*<![CDATA[*/
    const endpointCompute = /*[[@{/mvc/ajax/jobs/api/request}]]*/ '/mvc/ajax/jobs/api/request';
    const endpointNdvi = /*[[@{/mvc/ajax/jobs/api/ndvi/request}]]*/ '/mvc/ajax/jobs/api/ndvi/request';
    const endpointPublish = /*[[@{/mvc/ajax/publish/api/request}]]*/ '/mvc/ajax/publish/api/request';
    const endpointPublishReferential = /*[[@{/mvc/ajax/publish/api/referential}]]*/ '/mvc/ajax/publish/api/referential';
    const spinner = document.getElementById("computeSpinner");

    function showSpinner() { if (spinner) spinner.style.display = "inline-block"; }
    function hideSpinner() { if (spinner) spinner.style.display = "none"; }

    async function doPostCompute(payload) {
        showSpinner();
        try {
            let response = await fetch(endpointCompute, {
                method: "POST",
                headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (response.status == 202 || response.status == 200) {
                const content = await response.json();
                alert("Calcul demand\u00e9 pour " + content.nbCarre + " carr\u00e9s.");
            } else {
                alert("Erreur lors de la demande de calcul.");
            }
        } catch (error) {
            console.error("Error during compute request:", error);
            alert("Erreur lors de la communication avec le serveur.");
        } finally {
            hideSpinner();
        }
    }

    function requestComputeEpci() {
        const sel = document.getElementById("idCommunauteDeCommunes");
        if (!sel || !sel.value) { alert("Veuillez s\u00e9lectionner un EPCI."); return; }
        const yearSel = document.getElementById("requestedYear");
        doPostCompute({
            token: [[${token}]],
            com2coId: sel.value,
            requestedYear: yearSel ? (yearSel.value || null) : null
        });
    }

    function requestComputeCity() {
        const sel = document.getElementById("idCity");
        if (!sel || !sel.value) { alert("Veuillez s\u00e9lectionner une ville."); return; }
        const yearSel = document.getElementById("requestedYear");
        doPostCompute({
            token: [[${token}]],
            cityId: sel.value,
            requestedYear: yearSel ? (yearSel.value || null) : null
        });
    }

    function launchParkOverpass() {
        doPostCompute({
            token: [[${token}]],
            parkOverpass: true
        });
        alert("Traitement des parcs Overpass d\u00e9marr\u00e9 avec succ\u00e8s");
        location.reload();
    }

    async function doPostNdvi(payload, btn, field = "nbCarre", label = "parc(s)") {
        showSpinner();
        btn.disabled = true;
        try {
            let response = await fetch(endpointNdvi, {
                method: "POST",
                headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (response.status == 202 || response.status == 200) {
                const content = await response.json();
                const count = content[field] || 0;
                alert(count > 0
                    ? "Relance Copernicus demand\u00e9e pour " + count + " " + label + "."
                    : "Aucun " + label + " NDVI trouv\u00e9.");
            } else if (response.status == 403) {
                alert("Action r\u00e9serv\u00e9e aux administrateurs.");
            } else {
                alert("Relance Copernicus impossible.");
            }
        } catch (error) {
            console.error("Error requesting NDVI refresh:", error);
            alert("Relance Copernicus impossible.");
        } finally {
            hideSpinner();
            btn.disabled = false;
        }
    }

    function requestedYearValue() {
        const yearSel = document.getElementById("requestedYear");
        return yearSel ? (yearSel.value || null) : null;
    }

    function requestNdviEpci() {
        const sel = document.getElementById("idCommunauteDeCommunes");
        if (!sel || !sel.value) { alert("Veuillez s\u00e9lectionner un EPCI."); return; }
        doPostNdvi({
            token: [[${token}]],
            com2coId: sel.value,
            requestedYear: requestedYearValue()
        }, document.getElementById("btnNdviEpci"));
    }

    function requestNdviCity() {
        const sel = document.getElementById("idCity");
        if (!sel || !sel.value) { alert("Veuillez s\u00e9lectionner une ville."); return; }
        doPostNdvi({
            token: [[${token}]],
            cityId: sel.value,
            requestedYear: requestedYearValue()
        }, document.getElementById("btnNdviCity"));
    }

    function requestNdviIrisEpci() {
        const sel = document.getElementById("idCommunauteDeCommunes");
        if (!sel || !sel.value) { alert("Veuillez s\u00e9lectionner un EPCI."); return; }
        doPostNdvi({
            token: [[${token}]],
            com2coId: sel.value,
            iris: true
        }, document.getElementById("btnNdviIrisEpci"), "nbIris", "IRIS");
    }

    function requestNdviIrisCity() {
        const sel = document.getElementById("idCity");
        if (!sel || !sel.value) { alert("Veuillez s\u00e9lectionner une ville."); return; }
        doPostNdvi({
            token: [[${token}]],
            cityId: sel.value,
            iris: true
        }, document.getElementById("btnNdviIrisCity"), "nbIris", "IRIS");
    }

    function selectedText(id) {
        const sel = document.getElementById(id);
        return sel && sel.selectedIndex >= 0 ? sel.options[sel.selectedIndex].text : "";
    }

    function confirmation(titre, lignes) {
        return window.confirm(titre + "\n\n- " + lignes.join("\n- "));
    }

    async function doPostPublish(url, payload, messageOk) {
        showSpinner();
        try {
            let response = await fetch(url, {
                method: "POST",
                headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (response.status === 202 || response.status === 200) {
                alert(messageOk + " Le commit final se fait depuis le dashboard Exports.");
            } else if (response.status === 412) {
                alert("Publication impossible : les calculs de cet EPCI ne sont pas termin\u00e9s.");
            } else if (response.status === 401 || response.status === 403) {
                alert("Action r\u00e9serv\u00e9e aux administrateurs.");
            } else {
                const content = await response.json().catch(() => ({}));
                alert(content.message || "Publication impossible.");
            }
        } catch (error) {
            console.error("Error during publish request:", error);
            alert("Erreur lors de la communication avec le serveur.");
        } finally {
            hideSpinner();
        }
    }

    function publishEpci() {
        const sel = document.getElementById("idCommunauteDeCommunes");
        if (!sel || !sel.value) { alert("Veuillez s\u00e9lectionner un EPCI."); return; }
        const nom = selectedText("idCommunauteDeCommunes");
        if (!confirmation("Publier les donn\u00e9es de l'EPCI \u00ab " + nom + " \u00bb ?",
                ["carreaux", "parcs", "statistiques"])) return;
        doPostPublish(endpointPublish, {
            token: [[${token}]],
            com2coId: sel.value,
            requestedYear: requestedYearValue()
        }, "Publication des donn\u00e9es de l'EPCI demand\u00e9e.");
    }

    function publishCity() {
        const city = document.getElementById("idCity");
        const sel = document.getElementById("idCommunauteDeCommunes");
        if (!city || !city.value) { alert("Veuillez s\u00e9lectionner une ville."); return; }
        if (!sel || !sel.value) { alert("Veuillez s\u00e9lectionner l'EPCI de la ville."); return; }
        const nomVille = selectedText("idCity");
        const nomEpci = selectedText("idCommunauteDeCommunes");
        if (!confirmation("Publier les donn\u00e9es de la ville \u00ab " + nomVille + " \u00bb (EPCI \u00ab " + nomEpci + " \u00bb) ?",
                ["carreaux", "parcs", "statistiques"])) return;
        doPostPublish(endpointPublish, {
            token: [[${token}]],
            com2coId: sel.value,
            requestedYear: requestedYearValue()
        }, "Publication des donn\u00e9es de la ville demand\u00e9e (EPCI \u00ab " + nomEpci + " \u00bb).");
    }

    function publishReferential() {
        if (!confirmation("Publier le r\u00e9f\u00e9rentiel ?", ["r\u00e9gions", "EPCI", "villes"])) return;
        doPostPublish(endpointPublishReferential, {
            token: [[${token}]]
        }, "Publication du r\u00e9f\u00e9rentiel demand\u00e9e.");
    }
    /*]]>*/
    </script>
</body>
</html>
